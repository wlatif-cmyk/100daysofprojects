<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currency Converter</title>
</head>
<body>
    <h1>Currency Converter</h1>

    <form method="post">
        <div>
            <label>Amount:</label>
            <input type="number" step="0.01" min="0" name="amount" required>
        </div>

        <div>
            <label>From:</label>
            <select name="from_currency">
                {% for code in currencies %}
                    <option value="{{ code }}" {% if code == "USD" %}selected{% endif %}>
                        {{ code }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label>To:</label>
            <select name="to_currency">
                {% for code in currencies %}
                    <option value="{{ code }}" {% if code == "EUR" %}selected{% endif %}>
                        {{ code }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <button type="submit">Convert</button>
        </div>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if result %}
        <p>
            {{ result.amount }} {{ result.from_currency }}
            =
            <strong>{{ result.converted }} {{ result.to_currency }}</strong>
        </p>
        <p>
            Rate: 1 {{ result.from_currency }} = {{ result.rate }} {{ result.to_currency }}
        </p>
    {% endif %}
</body>
</html>
